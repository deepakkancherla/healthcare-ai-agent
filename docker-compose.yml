name: healthcare-agent

services:
  healthcare-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: healthcare-agent:1.0.0
    init: true
    restart: unless-stopped
    command:
      - uvicorn
      - app.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  healthcare-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: healthcare-agent:1.0.0
    init: true
    restart: unless-stopped
    command:
      - python
      - -m
      - streamlit
      - run
      - app/ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      BACKEND_URL: http://healthcare-api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8501:8501"
    depends_on:
      healthcare-api:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          connection = socket.create_connection(('127.0.0.1', 8501), timeout=5);
          connection.close()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
